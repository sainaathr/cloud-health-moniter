apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: health-monitor-rules
  namespace: monitoring
  labels:
    release: monitoring          # must match Prometheus Operator selector
    app: health-monitor
spec:
  groups:
  # ── Pod Alerts ────────────────────────────────────────────────────────────
  - name: pod-health
    rules:
      # Alert when a pod has been in CrashLoopBackOff for more than 2 minutes
      - alert: PodCrashLoopBackOff
        expr: >
          kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"} == 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Pod {{ $labels.pod }} is in CrashLoopBackOff"
          description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} has been in CrashLoopBackOff for more than 2 minutes."

      # Alert when a pod fails to pull its image
      - alert: PodImagePullBackOff
        expr: >
          kube_pod_container_status_waiting_reason{reason=~"ImagePullBackOff|ErrImagePull"} == 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Pod {{ $labels.pod }} cannot pull image"
          description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} is failing to pull its container image."

      # Alert when a pod has restarted more than 5 times
      - alert: PodHighRestartCount
        expr: >
          kube_pod_container_status_restarts_total > 5
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "High restart count for pod {{ $labels.pod }}"
          description: "Container {{ $labels.container }} in pod {{ $labels.pod }} has restarted {{ $value }} times."

      # Alert when a pod is not in Running or Succeeded state
      - alert: PodNotRunning
        expr: >
          kube_pod_status_phase{phase!~"Running|Succeeded"} == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Pod {{ $labels.pod }} is not running"
          description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} has been in phase {{ $labels.phase }} for more than 5 minutes."

  # ── Node Alerts ───────────────────────────────────────────────────────────
  - name: node-health
    rules:
      # Alert when a node is not Ready
      - alert: NodeNotReady
        expr: >
          kube_node_status_condition{condition="Ready",status="true"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Node {{ $labels.node }} is NotReady"
          description: "Node {{ $labels.node }} has been in NotReady state for more than 1 minute."

      # Alert when a node has memory pressure
      - alert: NodeMemoryPressure
        expr: >
          kube_node_status_condition{condition="MemoryPressure",status="true"} == 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Node {{ $labels.node }} has MemoryPressure"
          description: "Node {{ $labels.node }} is experiencing memory pressure."

      # Alert when a node has disk pressure
      - alert: NodeDiskPressure
        expr: >
          kube_node_status_condition{condition="DiskPressure",status="true"} == 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Node {{ $labels.node }} has DiskPressure"
          description: "Node {{ $labels.node }} is experiencing disk pressure."

  # ── Resource Alerts ───────────────────────────────────────────────────────
  - name: resource-usage
    rules:
      # High CPU usage warning
      - alert: HighCPUUsage
        expr: >
          (sum(rate(container_cpu_usage_seconds_total{container!=""}[5m])) by (pod, namespace)
          /
          sum(kube_pod_container_resource_limits{resource="cpu"}) by (pod, namespace)) * 100 > 70
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage on pod {{ $labels.pod }}"
          description: "Pod {{ $labels.pod }} CPU usage is above 70% for 5 minutes."

      # Critical CPU usage
      - alert: CriticalCPUUsage
        expr: >
          (sum(rate(container_cpu_usage_seconds_total{container!=""}[5m])) by (pod, namespace)
          /
          sum(kube_pod_container_resource_limits{resource="cpu"}) by (pod, namespace)) * 100 > 85
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Critical CPU usage on pod {{ $labels.pod }}"
          description: "Pod {{ $labels.pod }} CPU usage is above 85%."

      # High memory usage warning
      - alert: HighMemoryUsage
        expr: >
          (container_memory_working_set_bytes{container!=""}
          /
          kube_pod_container_resource_limits{resource="memory"}) * 100 > 70
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage on pod {{ $labels.pod }}"
          description: "Pod {{ $labels.pod }} memory usage is above 70%."
