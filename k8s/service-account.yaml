# ──────────────────────────────────────────────────────────────────────────────
# RBAC — ServiceAccount
# Every Pod that needs to call the Kubernetes API needs an identity.
# This ServiceAccount is the identity for the health-monitor controller.
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: health-monitor-sa
  namespace: health-monitor
  labels:
    app: health-monitor
