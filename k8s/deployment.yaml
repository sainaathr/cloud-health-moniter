# ──────────────────────────────────────────────────────────────────────────────
# Sample Application Deployment
# Deploys the Python Web Control Plane & Health Monitoring Application:
#   - 2 replicas for high availability
#   - Port 5000 configuration aligned across container, probes, and service
#   - Persistent SQLite storage volume via incident-data-pvc
#   - Liveness probe  → Kubernetes restarts the container if it is dead
#   - Readiness probe → Kubernetes removes the pod from the load balancer
#                       if it is not ready to serve traffic
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-app
  namespace: health-monitor
  labels:
    app: sample-app
    project: auto-k8s-health-monitor
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sample-app
  template:
    metadata:
      labels:
        app: sample-app
    spec:
      serviceAccountName: health-monitor-sa
      containers:
        - name: sample-app-ui
          image: sample-app-ui:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000

          env:
            - name: PORT
              value: "5000"
            - name: INCIDENT_DB_PATH
              value: "/app/data/incidents.db"
            - name: ENABLE_DESTRUCTIVE_CHAOS
              value: "true"

            # ── Email & SMTP Configuration ────────────────────────────────────
            - name: SMTP_HOST
              value: "smtp.gmail.com"
            - name: SMTP_PORT
              value: "587"
            - name: SMTP_FROM_EMAIL
              value: "sainaath.r738507@gmail.com"
            - name: SMTP_FROM
              value: "sainaath.r738507@gmail.com"
            - name: SMTP_DRY_RUN
              value: "false"
            - name: SMTP_TO_EMAIL
              value: "sainaath.r2025@vitstudent.ac.in"
            - name: SMTP_USE_TLS
              value: "true"
            - name: SMTP_TIMEOUT_SECONDS
              value: "10"

            # Credentials from Kubernetes Secret (optional: true allows graceful startup)
            - name: SMTP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: smtp-credentials
                  key: smtp-username
                  optional: true
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smtp-credentials
                  key: smtp-password
                  optional: true

          # ── Resource limits ────────────────────────────────────────────────
          resources:
            requests:
              cpu: "50m"      # 50 millicores = 5% of 1 CPU core
              memory: "64Mi"  # 64 Mebibytes
            limits:
              cpu: "200m"     # 200 millicores = 20% of 1 CPU core
              memory: "128Mi"

          # ── Liveness probe ─────────────────────────────────────────────────
          livenessProbe:
            httpGet:
              path: /health/live
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3

          # ── Readiness probe ────────────────────────────────────────────────
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 2

          volumeMounts:
            - name: incident-data
              mountPath: /app/data

      volumes:
        - name: incident-data
          persistentVolumeClaim:
            claimName: incident-data-pvc
