# ==============================================================================
# Kubernetes Secret Template for SMTP Email Alerting
# ==============================================================================
# Namespace : health-monitor
# Secret    : smtp-secret
# Keys      : smtp-user, smtp-password
#
# QUICK SETUP VIA KUBECTL (Recommended - never commit real passwords to git):
#   kubectl create secret generic smtp-secret \
#     --from-literal=smtp-user="your-sending-email@gmail.com" \
#     --from-literal=smtp-password="your-16-char-app-password" \
#     -n health-monitor
#
# OR APPLY THIS FILE MANUALLY:
#   1. Copy this file to k8s/smtp-secret.yaml (gitignored)
#   2. Base64-encode your credentials:
#        [Convert]::ToBase64String([System.Text.Encoding]::UTF8.GetBytes("your-email@gmail.com"))
#        [Convert]::ToBase64String([System.Text.Encoding]::UTF8.GetBytes("your-app-password"))
#   3. Put values below and run: kubectl apply -f k8s/smtp-secret.yaml
# ==============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: smtp-secret
  namespace: health-monitor
  labels:
    app: health-monitor
    component: alerting
type: Opaque
stringData:
  # Replace with your actual sending Gmail / SMTP account
  smtp-user: "your-sending-email@gmail.com"
  # Replace with your Google 16-character App Password (not your personal password)
  smtp-password: "your-app-password-here"
